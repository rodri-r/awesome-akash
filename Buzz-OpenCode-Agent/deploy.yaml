---
version: "2.0"

services:
  moneypenny:
    image: rodrirr/moneypenny:1.3
    expose:
      - port: 3000
        as: 3000
        proto: tcp
        to:
          - global: true
    env:
      # Agent Nostr Identity
      # Generate with: docker run --rm --entrypoint /usr/local/bin/buzz-admin ghcr.io/block/buzz:main generate-key
      # Each agent needs its own unique keypair, never reuse the relay key
      - BUZZ_PRIVATE_KEY=REPLACE_WITH_AGENT_SECRET_KEY

      # Relay Connection
      - BUZZ_RELAY_URL=ws://REPLACE_WITH_RELAY_PROVIDER_URL:PORT

      # Access Control
      # Your hex pubkey, get it from the Buzz Desktop app
      - BUZZ_ACP_AGENT_OWNER=REPLACE_WITH_YOUR_HEX_PUBKEY

      # LLM Provider - Option A: AkashML (recommended on Akash)
      - OPENCODE_BASE_URL=https://api.akashml.com/v1
      - OPENCODE_API_KEY=REPLACE_WITH_AKASHML_KEY
      - OPENCODE_MODEL=deepseek-ai/DeepSeek-V4-Flash-0731

      # LLM Provider - Option B: Anthropic (comment out Option A first)
      # - OPENCODE_BASE_URL=https://api.anthropic.com
      # - OPENCODE_API_KEY=REPLACE_WITH_ANTHROPIC_KEY
      # - OPENCODE_MODEL=claude-sonnet-4-5

      # LLM Provider - Option C: OpenRouter (comment out Option A first)
      # - OPENCODE_BASE_URL=https://openrouter.ai/api/v1
      # - OPENCODE_API_KEY=REPLACE_WITH_OPENROUTER_KEY
      # - OPENCODE_MODEL=deepseek/deepseek-chat

      # LLM Provider - Option D: Groq (comment out Option A first)
      # - OPENCODE_BASE_URL=https://api.groq.com/openai/v1
      # - OPENCODE_API_KEY=REPLACE_WITH_GROQ_KEY
      # - OPENCODE_MODEL=llama-3.3-70b-versatile

    params:
      storage:
        moneypenny-data:
          mount: /data

profiles:
  compute:
    moneypenny:
      resources:
        cpu:
          units: 4
        memory:
          size: 8Gi
        storage:
          - size: 10Gi
          - name: moneypenny-data
            size: 50Gi
            attributes:
              persistent: true
              class: beta3

  placement:
    dcloud:
      pricing:
        moneypenny:
          denom: uact
          amount: 10000

deployment:
  moneypenny:
    dcloud:
      profile: moneypenny
      count: 1
